<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'partials/_head.html' %}
    <title>{% block title %}Status{% endblock %} · GrowAssistant Bridge</title>
    {% block head %}{% endblock %}
</head>
<body>
    {% include 'partials/_header.html' %}

    <main class="mx-auto max-w-content px-4 pt-6 pb-12 lg:px-8 lg:pt-8 flex flex-col gap-6">
        {% block content %}{% endblock %}
    </main>

    <div id="modals-container">
        {% block modals %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
