{% extends "auth_base.html" %}

{% block title %}{{ code }}{% endblock %}

{% block card %}
<div class="flex flex-col gap-2">
    <span class="ovl">Error {{ code }}</span>
    <h1 class="text-title-2 m-0">
        {% if code == 404 %}This page doesn't exist{% elif code == 500 %}Something went wrong on the bridge{% else %}Something went wrong{% endif %}
    </h1>
    <p class="m-0 text-muted">{{ error }}</p>
</div>
<div class="flex flex-wrap gap-2">
    <a href="/" class="btn btn-primary">Back to status</a>
    <button type="button" onclick="history.back()" class="btn btn-secondary">Go back</button>
</div>
{% endblock %}
