<header class="topbar">
    <div class="mx-auto max-w-content px-4 py-3 lg:px-8 flex flex-wrap items-center gap-x-6 gap-y-2">
        <a href="/" class="flex items-center gap-3 text-fg no-underline mr-auto lg:mr-0" aria-label="GrowAssistant Bridge, status">
            <span class="logo-tile">{% include 'partials/_logo.html' %}</span>
            <span class="flex flex-col">
                <span class="font-semibold text-fg">GrowAssistant Bridge</span>
                <span class="cap">Local control on this network</span>
            </span>
        </a>
        <a href="/logout" class="btn btn-ghost lg:order-last">Sign out</a>
        <nav aria-label="Bridge" class="flex flex-wrap gap-1 w-full lg:w-auto lg:flex-1">
            <a href="/" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>Status</a>
            <a href="/#devices" class="nav-link">Devices</a>
            <a href="/#integrations" class="nav-link">Integrations</a>
            <a href="/config" class="nav-link {% if request.endpoint == 'config_page' %}active{% endif %}" {% if request.endpoint == 'config_page' %}aria-current="page"{% endif %}>Settings</a>
        </nav>
    </div>
</header>
