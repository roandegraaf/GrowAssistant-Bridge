{% extends "auth_base.html" %}

{% block title %}Set up{% endblock %}

{% block card %}
<div class="flex flex-col gap-1">
    <h1 class="text-title-2 m-0">Secure this bridge</h1>
    <p class="m-0 text-muted">Create the account that protects this page on your network.</p>
</div>

{% include 'partials/_form_error.html' %}

<form method="POST" action="/setup" class="flex flex-col gap-4">
    <div>
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" value="admin" required autofocus autocomplete="username" class="form-input">
        <p class="form-hint">You can keep "admin".</p>
    </div>
    <div>
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password" class="form-input">
    </div>
    <div>
        <label for="confirm_password" class="form-label">Repeat password</label>
        <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" class="form-input">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Create account</button>
</form>
{% endblock %}
